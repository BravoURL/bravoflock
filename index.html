<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF8F2">
<title>BravoFlock</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF8F2;color:#2A2620;font-family:Georgia,serif}
@media (prefers-color-scheme:dark){body{background:#1C1A17;color:#EDE6D8}}
.w{font-size:30px;font-weight:700}.w span{color:#A8874A}.m{font:14px system-ui,sans-serif;opacity:.7;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div><div class="w">Bravo<span>Flock</span></div><div class="m" id="m"></div></div>
<script>
/* BravoFlock loader: this page never changes. It runs the latest published version of the app (code only, no hymn text). */
(async()=>{
  const URL='https://xgmnyhpzuwngdngtttux.supabase.co/rest/v1/flock_app_versions?select=id,html&order=id.desc&limit=1';
  const KEY='sb_publishable_pTYp1DS4yrzeytovirmEWw_77BulU8_', C='bravoflock-app';
  const run=h=>{document.open();document.write(h);document.close()};
  let cached=null; try{cached=JSON.parse(localStorage.getItem(C))}catch(e){}
  try{
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(URL,{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store',signal:ctl.signal});
    clearTimeout(t);
    const rows=await r.json();
    if(rows&&rows[0]&&rows[0].html){try{localStorage.setItem(C,JSON.stringify(rows[0]))}catch(e){} return run(rows[0].html)}
  }catch(e){}
  if(cached&&cached.html) return run(cached.html);
  document.getElementById('m').textContent='Couldn’t load. Check your connection and refresh.';
})();
</script>
</body>
</html>
